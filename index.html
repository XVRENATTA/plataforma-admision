<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study App</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="homeScreen" class="screen active">
<h1>📚 Study App</h1>
<div class="menu">
<button onclick="showPractice()">🎯 Practicar</button>
<button onclick="showStudy()">📘 Estudiar</button>
</div>
</div>

<div id="practiceScreen" class="screen">
<button onclick="goHome()">⬅ Inicio</button>

<h2>Modo práctica</h2>

<select id="subjectSelect"></select>

<select id="difficultySelect">
<option value="all">Todas</option>
<option value="facil">Fácil</option>
<option value="medio">Medio</option>
<option value="dificil">Difícil</option>
</select>

<div id="questionBox">
<h3 id="questionText"></h3>

<div id="optionsContainer"></div>

<input id="answerInput" placeholder="Tu respuesta">

<div class="buttons">
<button onclick="checkAnswer()">Responder</button>
<button onclick="showHint()">Hint</button>
<button onclick="nextQuestion()">Siguiente</button>
</div>

<p id="feedback"></p>
<p id="hintBox"></p>
<pre id="explanationBox"></pre>
</div>

<div id="stats">
<p id="correctCount">Correctas: 0</p>
<p id="wrongCount">Incorrectas: 0</p>
<p id="xpDisplay">XP: 0</p>
<p id="weakTopic">Tema débil: Ninguno</p>
</div>
</div>

<div id="studyScreen" class="screen">
<button onclick="goHome()">⬅ Inicio</button>

<h2>📘 Estudiar</h2>

<select id="studySubject"></select>
<select id="studyTopic"></select>

<div id="studyContentBox"></div>
</div>

<script src="data.js"></script>
<script src="study.js"></script>
<script src="app.js"></script>

</body>
</html>
