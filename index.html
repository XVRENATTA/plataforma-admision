
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma Admisión</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<h1>📚 Plataforma Admisión</h1>

<div class="study-section">

<h2>📖 Zona de Estudio</h2>

<select id="studyTopicSelect" onchange="showStudyTopic()">
<option value="ley_signos">Ley de signos</option>
<option value="jerarquia">Jerarquía de operaciones</option>
<option value="lineales">Ecuaciones lineales</option>
<option value="segundo_grado">Segundo grado</option>
<option value="pitagoras">Teorema de Pitágoras</option>
<option value="mru">MRU</option>
<option value="mruv">MRUV</option>
<option value="fuerza">Fuerza</option>
<option value="atomos">Átomos</option>
<option value="balanceo">Balanceo químico</option>
</select>

<div id="studyContent" class="study-content"></div>

</div>

<div class="dashboard">

<div class="level-box">

<h2>🚀 Nivel <span id="level">1</span></h2>

<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>

<p><span id="xp">0</span> XP</p>

</div>

<div class="stats-grid">

<div class="stat">
✅
<h3 id="correct">0</h3>
<p>Correctas</p>
</div>

<div class="stat">
❌
<h3 id="wrong">0</h3>
<p>Incorrectas</p>
</div>

<div class="stat">
📊
<h3 id="accuracy">0%</h3>
<p>Precisión</p>
</div>

<div class="stat">
🔥
<h3 id="weakCount">0</h3>
<p>Errores</p>
</div>

</div>

</div>

<div class="selectors">

<select id="subjectSelect">
<option value="math">🧮 Matemáticas</option>
<option value="physics">⚛️ Física</option>
<option value="chemistry">🧪 Química</option>
</select>

<select id="difficultySelect">
<option value="easy">⭐ Fácil</option>
<option value="medium">🔥 Medio</option>
<option value="hard">💀 Difícil</option>
</select>

</div>

<div class="question-card">

<p class="topic" id="topic"></p>

<h2 id="question"></h2>

<div id="multipleChoice"></div>

<input type="text" id="answer" placeholder="Escribe tu respuesta...">

<div class="buttons">

<button onclick="checkAnswer()" class="primary">
Revisar
</button>

<button onclick="nextQuestion()" class="secondary">
Siguiente
</button>

<button onclick="practiceWeakTopics()" class="danger">
🔥 Practicar errores
</button>

</div>

<div id="result"></div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
