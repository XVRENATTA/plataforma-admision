
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma Admisión</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<div id="homeScreen" class="screen active">

<h1>📚 Plataforma Admisión</h1>

<div class="menu-buttons">

<button class="main-btn" onclick="showPractice()">
🎯 Practicar
</button>

<button class="main-btn" onclick="showStudy()">
📖 Estudiar
</button>

</div>

</div>

<div id="practiceScreen" class="screen">

<button class="back-btn" onclick="goHome()">
⬅ Volver
</button>

<h1>🎯 Modo Práctica</h1>

<div class="dashboard">

<div class="level-box">

<h2>🚀 Nivel <span id="level">1</span></h2>

<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>

<p><span id="xp">0</span> XP</p>

</div>

<div class="stats-grid">

<div class="stat">
✅
<h3 id="correct">0</h3>
<p>Correctas</p>
</div>

<div class="stat">
❌
<h3 id="wrong">0</h3>
<p>Incorrectas</p>
</div>

<div class="stat">
📊
<h3 id="accuracy">0%</h3>
<p>Precisión</p>
</div>

<div class="stat">
🔥
<h3 id="weakCount">0</h3>
<p>Errores</p>
</div>

</div>

</div>

<div class="selectors">

<select id="subjectSelect">
<option value="math">🧮 Matemáticas</option>
<option value="physics">⚛️ Física</option>
<option value="chemistry">🧪 Química</option>
</select>

<select id="difficultySelect">
<option value="easy">⭐ Fácil</option>
<option value="medium">🔥 Medio</option>
<option value="hard">💀 Difícil</option>
</select>

</div>

<div class="question-card">

<p class="topic" id="topic"></p>

<h2 id="question"></h2>

<div id="multipleChoice"></div>

<input type="text" id="answer" placeholder="Escribe tu respuesta...">

<div class="buttons">

<button onclick="checkAnswer()" class="primary">
Revisar
</button>

<button onclick="nextQuestion()" class="secondary">
Siguiente
</button>

</div>

<div id="result"></div>

</div>

</div>

<div id="studyScreen" class="screen">

<button class="back-btn" onclick="goHome()">
⬅ Volver
</button>

<h1>📖 Zona de Estudio</h1>

<div class="study-panel">

<select id="studySubject" onchange="updateTopics()">

<option value="math">🧮 Matemáticas</option>

<option value="physics">⚛️ Física</option>

<option value="chemistry">🧪 Química</option>

</select>

<select id="studyTopic" onchange="showStudyContent()">
</select>

<div class="study-content" id="studyContent"></div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
